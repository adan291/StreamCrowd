<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Login - Redirecting...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0e0e10 0%, #18181b 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(169, 112, 255, 0.2);
      border-top-color: #a970ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #efeff1;
    }
    p {
      color: #adadb8;
      font-size: 0.875rem;
    }
    .error {
      background: rgba(255, 85, 85, 0.1);
      border: 1px solid rgba(255, 85, 85, 0.3);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1rem;
      display: none;
    }
    .error.show {
      display: block;
    }
    .error p {
      color: #ff5555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Completing login...</h1>
    <p id="message">Please wait while we finish authenticating.</p>
    <div class="error" id="error">
      <p id="errorMessage"></p>
    </div>
  </div>

  <script>
    (function() {
      /**
       * Twitch OAuth Callback Handler
       * Supports both:
       * - Implicit flow (access_token in URL fragment)
       * - Authorization code flow with PKCE (code in query params)
       * 
       * **Validates: Requirements 2.3, 2.4**
       */
      
      // Parse URL fragment (for implicit flow - access_token)
      const hash = window.location.hash.substring(1);
      const hashParams = new URLSearchParams(hash);
      
      // Parse query params (for PKCE flow - authorization code)
      const queryParams = new URLSearchParams(window.location.search);
      
      // Check for authorization code (PKCE flow)
      const code = queryParams.get('code');
      const state = queryParams.get('state') || hashParams.get('state');
      
      // Check for access token (implicit flow - legacy)
      const accessToken = hashParams.get('access_token');
      
      // Check for errors
      const error = queryParams.get('error') || hashParams.get('error');
      const errorDescription = queryParams.get('error_description') || hashParams.get('error_description');
      
      function showError(message) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Authentication Failed';
        document.getElementById('message').textContent = 'There was a problem logging in.';
        document.getElementById('error').classList.add('show');
        document.getElementById('errorMessage').textContent = message;
      }
      
      // Check if we have an opener window
      if (!window.opener) {
        showError('This page should be opened from the main application.');
        return;
      }
      
      // Handle PKCE flow (authorization code)
      if (code) {
        window.opener.postMessage({
          type: 'twitch_oauth_callback',
          code: code,
          state: state,
          isPkce: true,
        }, window.location.origin);
        
        // Close popup quickly
        setTimeout(function() { window.close(); }, 150);
        return;
      }
      
      // Handle implicit flow (access token - legacy)
      if (accessToken) {
        window.opener.postMessage({
          type: 'twitch_oauth_callback',
          accessToken: accessToken,
          state: state,
          isPkce: false,
        }, window.location.origin);
        
        // Close popup quickly
        setTimeout(function() { window.close(); }, 150);
        return;
      }
      
      // Handle errors
      if (error) {
        window.opener.postMessage({
          type: 'twitch_oauth_callback',
          error: error,
          errorDescription: errorDescription || 'Authentication was denied or failed.',
          state: state,
        }, window.location.origin);
        
        showError(errorDescription || 'Authentication was denied.');
        setTimeout(function() { window.close(); }, 2000);
        return;
      }
      
      // No valid data received
      showError('No authentication data received.');
      setTimeout(function() { window.close(); }, 2000);
    })();
  </script>
</body>
</html>
