<svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1f4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a970ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shadow -->
  <ellipse cx="25" cy="47" rx="18" ry="3" fill="#000" opacity="0.2"/>
  
  <!-- Body -->
  <rect x="2" y="5" width="46" height="40" rx="8" fill="url(#screenGrad)" stroke="url(#glowGrad)" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- Inner screen glow -->
  <rect x="5" y="8" width="40" height="34" rx="5" fill="#a970ff" opacity="0.15"/>
  
  <!-- Scan line effect -->
  <rect x="5" y="12" width="40" height="1.5" fill="#a970ff" opacity="0.2"/>
  <rect x="5" y="24" width="40" height="1" fill="#a970ff" opacity="0.1"/>
  <rect x="5" y="36" width="40" height="1.5" fill="#a970ff" opacity="0.2"/>
  
  <!-- Left Eye -->
  <ellipse cx="17" cy="22" rx="5.5" ry="6.5" fill="#a970ff"/>
  <circle cx="14.5" cy="19.5" r="2.2" fill="white" opacity="0.95"/>
  <circle cx="18.5" cy="23.5" r="1.2" fill="white" opacity="0.5"/>
  
  <!-- Right Eye -->
  <ellipse cx="33" cy="22" rx="5.5" ry="6.5" fill="#a970ff"/>
  <circle cx="30.5" cy="19.5" r="2.2" fill="white" opacity="0.95"/>
  <circle cx="34.5" cy="23.5" r="1.2" fill="white" opacity="0.5"/>
  
  <!-- Happy Mouth -->
  <path d="M 14 30 Q 25 38 36 30" fill="none" stroke="#a970ff" stroke-width="2.8" stroke-linecap="round"/>
  
  <!-- Cheeks -->
  <ellipse cx="9" cy="27" rx="3.5" ry="2" fill="#f472b6" opacity="0.35"/>
  <ellipse cx="41" cy="27" rx="3.5" ry="2" fill="#f472b6" opacity="0.35"/>
  
  <!-- Antenna -->
  <line x1="25" y1="5" x2="25" y2="-1" stroke="#a970ff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="25" cy="-2" r="3" fill="#a970ff" filter="url(#glow)"/>
  <circle cx="25" cy="-2" r="1.5" fill="white" opacity="0.7"/>
</svg>
