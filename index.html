<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- SEO & Social -->
    <title>StreamCrowd - Herramientas Interactivas para Streamers</title>
    <meta name="description" content="Suite completa de herramientas para streamers: encuestas, sorteos, juegos, panel de jueces, analytics y más. Compatible con Twitch, YouTube y Kick." />
    <meta name="keywords" content="streaming, encuestas, polls, sorteos, giveaway, twitch, youtube, kick, streamer tools, interactivo" />
    <meta name="author" content="StreamCrowd" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="StreamCrowd - Herramientas Interactivas para Streamers" />
    <meta property="og:description" content="Suite completa de herramientas para streamers: encuestas, sorteos, juegos y más." />
    <meta property="og:image" content="/ai-vision-icon.png" />
    <meta name="twitter:card" content="summary" />
    
    <!-- PWA -->
    <meta name="theme-color" content="#9146FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StreamCrowd" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/ai-vision-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/ai-vision-icon.png" />
    <link rel="apple-touch-icon" href="/ai-vision-icon.png" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://embed.twitch.tv" />
    <link rel="preconnect" href="https://static-cdn.jtvnw.net" />
    
    <!-- Early overlay detection - prevents flash in OBS Browser Source -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var isOverlay = params.get('overlay') === 'true' ||
          params.get('overlayPoll') === 'true' ||
          params.get('overlayCountdown') === 'true' ||
          params.get('overlaySpinner') === 'true' ||
          params.get('overlayRandomWinner') === 'true' ||
          params.get('overlayJudgePanel') === 'true' ||
          params.get('overlayPium') === 'true' ||
          params.get('overlayRoulette') === 'true' ||
          params.get('overlayFishing') === 'true' ||
          params.get('overlayPotato') === 'true' ||
          params.get('overlayTrivia') === 'true' ||
          params.get('overlayBattleship') === 'true' ||
          params.get('overlayDuckHunt') === 'true' ||
          params.get('overlayVeoVeo') === 'true' ||
          params.get('overlayPPT') === 'true' ||
          params.get('overlayAhorcado') === 'true' ||
          params.get('overlayCarrera') === 'true' ||
          params.get('overlayMemoria') === 'true' ||
          params.get('overlayPartyCo') === 'true';
        
        if (isOverlay) {
          document.documentElement.style.background = 'transparent';
          document.documentElement.classList.add('overlay-mode');
          // Add no-cache meta for OBS
          var meta = document.createElement('meta');
          meta.httpEquiv = 'Cache-Control';
          meta.content = 'no-cache, no-store, must-revalidate';
          document.head.appendChild(meta);
          console.log('[Overlay] Mode detected:', window.location.search);
        }
      })();
    </script>
    <style>
      /* Overlay mode - transparent background before React loads */
      html.overlay-mode,
      html.overlay-mode body {
        background: transparent !important;
        background-image: none !important;
      }
    </style>
    
    <!-- Auto-reload on cache/chunk errors (404 on JS/CSS files) -->
    <script>
      (function() {
        var RELOAD_KEY = 'streamcrowd_cache_cleared';
        var RELOAD_TIME_KEY = 'streamcrowd_cache_cleared_time';
        var hasReloaded = sessionStorage.getItem(RELOAD_KEY);
        var reloadTime = parseInt(sessionStorage.getItem(RELOAD_TIME_KEY) || '0', 10);
        var now = Date.now();
        
        // Solo permitir un reload cada 30 segundos para evitar loops
        var canReload = !hasReloaded || (now - reloadTime > 30000);
        
        function clearCacheAndReload(reason) {
          if (!canReload) {
            console.error('[Cache] Already tried clearing cache recently, not reloading again. Reason:', reason);
            return;
          }
          
          console.warn('[Cache] Clearing all caches due to:', reason);
          sessionStorage.setItem(RELOAD_KEY, 'true');
          sessionStorage.setItem(RELOAD_TIME_KEY, String(now));
          
          var promises = [];
          
          // Limpiar Service Workers
          if ('serviceWorker' in navigator) {
            promises.push(
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).catch(function() {})
            );
          }
          
          // Limpiar todos los caches
          if ('caches' in window) {
            promises.push(
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).catch(function() {})
            );
          }
          
          Promise.all(promises).finally(function() {
            console.log('[Cache] Cleared, reloading...');
            window.location.reload(true);
          });
        }
        
        // Limpiar flags después de carga exitosa
        window.addEventListener('load', function() {
          setTimeout(function() {
            sessionStorage.removeItem(RELOAD_KEY);
            sessionStorage.removeItem(RELOAD_TIME_KEY);
          }, 3000);
        });
        
        // Interceptar errores de recursos (scripts, stylesheets)
        window.addEventListener('error', function(e) {
          var target = e.target;
          
          // Error en script o link (CSS)
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || '';
            // Solo para archivos con hash (chunks de Vite)
            if (src.match(/[-\.][A-Za-z0-9]{8}\.(js|css)$/)) {
              clearCacheAndReload('Failed to load chunk: ' + src);
              return;
            }
          }
          
          // Error de módulo ES
          if (e.message && (e.message.includes('MIME type') || 
              e.message.includes('module script') ||
              e.message.includes('Failed to fetch dynamically imported module'))) {
            clearCacheAndReload('Module error: ' + e.message);
          }
        }, true);
        
        // Interceptar fetch para detectar 404 en chunks dinámicos
        var originalFetch = window.fetch;
        window.fetch = function(url, options) {
          return originalFetch.apply(this, arguments).then(function(response) {
            var urlStr = typeof url === 'string' ? url : (url.url || '');
            // Detectar 404 en chunks JS/CSS con hash
            if (response.status === 404 && urlStr.match(/[-\.][A-Za-z0-9]{8}\.(js|css)$/)) {
              clearCacheAndReload('404 on chunk: ' + urlStr);
            }
            return response;
          });
        };
        
        // Vite specific: detectar errores de import dinámico
        window.addEventListener('vite:preloadError', function(e) {
          clearCacheAndReload('Vite preload error: ' + (e.payload && e.payload.message));
        });
      })();
    </script>
    
    <!-- Twitch Embed -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/index.css" />

      <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f0f11; color: white; font-family: system-ui;">
        <div style="text-align: center; padding: 2rem;">

        </div>

    <!-- Main Script -->
    <script type="module" src="/index.tsx"></script>

</html>
