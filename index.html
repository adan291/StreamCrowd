    <!-- Early overlay detection - prevents flash in OBS Browser Source -->
    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var isOverlay = params.get('overlay') === 'true' ||
          params.get('overlayPoll') === 'true' ||
          params.get('overlayCountdown') === 'true' ||
          params.get('overlaySpinner') === 'true' ||
          params.get('overlayRandomWinner') === 'true' ||
          params.get('overlayJudgePanel') === 'true' ||
          params.get('overlayPium') === 'true' ||
          params.get('overlayRoulette') === 'true' ||
          params.get('overlayFishing') === 'true' ||
          params.get('overlayPotato') === 'true' ||
          params.get('overlayTrivia') === 'true' ||
          params.get('overlayBattleship') === 'true' ||
          params.get('overlayDuckHunt') === 'true' ||
          params.get('overlayVeoVeo') === 'true' ||
          params.get('overlayPPT') === 'true' ||
          params.get('overlayAhorcado') === 'true' ||
          params.get('overlayCarrera') === 'true' ||
          params.get('overlayMemoria') === 'true' ||
          params.get('overlayPartyCo') === 'true';
        
        if (isOverlay) {
          document.documentElement.style.background = 'transparent';
          document.documentElement.classList.add('overlay-mode');
          // Add no-cache meta for OBS
          var meta = document.createElement('meta');
          meta.httpEquiv = 'Cache-Control';
          meta.content = 'no-cache, no-store, must-revalidate';
          document.head.appendChild(meta);
          console.log('[Overlay] Mode detected:', window.location.search);
        }
      })();
    </script>
    <style>
      /* Overlay mode - transparent background before React loads */
      html.overlay-mode,
      html.overlay-mode body {
        background: transparent !important;
        background-image: none !important;
      }
    </style>
    
    <!-- Auto-reload on cache/chunk errors (404 on JS/CSS files) -->
    <script>
      (function() {
        var BUILD_VERSION = '__BUILD_TIME__'; // Se reemplaza en build
        var STORED_VERSION_KEY = 'streamcrowd_version';
        var RELOAD_KEY = 'streamcrowd_cache_cleared';
        var RELOAD_TIME_KEY = 'streamcrowd_cache_cleared_time';
        
        // Verificar si hay nueva versión disponible
        function checkForUpdates() {
          var storedVersion = localStorage.getItem(STORED_VERSION_KEY);
          if (storedVersion && storedVersion !== BUILD_VERSION && BUILD_VERSION !== '__BUILD_TIME__') {
            console.log('[Update] Nueva versión detectada:', BUILD_VERSION, '(anterior:', storedVersion + ')');
            clearCacheAndReload('Nueva versión disponible');
            return true;
          }
          if (BUILD_VERSION !== '__BUILD_TIME__') {
            localStorage.setItem(STORED_VERSION_KEY, BUILD_VERSION);
          }
          return false;
        }
        
        // DEVELOPMENT: Force unregister service workers on localhost
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(registration) {
                console.log('[DEV] Unregistering service worker:', registration.scope);
                registration.unregister();
              });
            });
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) {
                  console.log('[DEV] Deleting cache:', name);
                  caches.delete(name);
                });
              });
            }
          }
        }
        
        var hasReloaded = sessionStorage.getItem(RELOAD_KEY);
        var reloadTime = parseInt(sessionStorage.getItem(RELOAD_TIME_KEY) || '0', 10);
        var now = Date.now();
        var canReload = !hasReloaded || (now - reloadTime > 30000);
        
        function clearCacheAndReload(reason) {
          if (!canReload) {
            console.error('[Cache] Ya se intentó limpiar cache recientemente. Razón:', reason);
            return;
          }
          
          console.warn('[Cache] Limpiando caches:', reason);
          sessionStorage.setItem(RELOAD_KEY, 'true');
          sessionStorage.setItem(RELOAD_TIME_KEY, String(now));
          
          var promises = [];
          
          if ('serviceWorker' in navigator) {
            promises.push(
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).catch(function() {})
            );
          }
          
          if ('caches' in window) {
            promises.push(
              caches.keys().then(function(names) {
                return Promise.all(names.map(function(n) { return caches.delete(n); }));
              }).catch(function() {})
            );
          }
          
          Promise.all(promises).finally(function() {
            console.log('[Cache] Limpiado, recargando...');
            window.location.reload(true);
          });
        }
        
        // Verificar versión al cargar
        if (!checkForUpdates()) {
          // Limpiar flags después de carga exitosa
          window.addEventListener('load', function() {
            setTimeout(function() {
              sessionStorage.removeItem(RELOAD_KEY);
              sessionStorage.removeItem(RELOAD_TIME_KEY);
            }, 3000);
            
            // Verificar actualizaciones del SW
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
              navigator.serviceWorker.addEventListener('controllerchange', function() {
                console.log('[SW] Nuevo service worker activo, recargando...');
                window.location.reload();
              });
            }
          });
        }
        
        // Interceptar errores de recursos
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            var src = target.src || target.href || '';
            if (src.match(/[-\.][A-Za-z0-9]{8}\.(js|css)$/)) {
              clearCacheAndReload('Error cargando chunk: ' + src);
              return;
            }
          }
          if (e.message && (e.message.includes('MIME type') || 
              e.message.includes('module script') ||
              e.message.includes('Failed to fetch dynamically imported module'))) {
            clearCacheAndReload('Error de módulo: ' + e.message);
          }
        }, true);
        
        // Interceptar fetch para detectar 404
        var originalFetch = window.fetch;
        window.fetch = function(url, options) {
          return originalFetch.apply(this, arguments).then(function(response) {
            var urlStr = typeof url === 'string' ? url : (url.url || '');
            if (response.status === 404 && urlStr.match(/[-\.][A-Za-z0-9]{8}\.(js|css)$/)) {
              clearCacheAndReload('404 en chunk: ' + urlStr);
            }
            return response;
          });
        };
        
        window.addEventListener('vite:preloadError', function(e) {
          clearCacheAndReload('Vite preload error');
        });
      })();
    </script>
