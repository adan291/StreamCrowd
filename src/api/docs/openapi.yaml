openapi: 3.0.3
info:
  title: TwitchVote Live API
  version: 1.0.0
  description: |
    API pública para integrar con TwitchVote Live.
    
    ## Autenticación
    Todas las peticiones requieren una API Key en el header `X-API-Key`.
    
    ## Rate Limiting
    - Por defecto: 60 requests/minuto
    - Headers de respuesta: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`
    
    ## WebSocket
    Conectar a `/api/v1/ws` con el header `X-API-Key` para eventos en tiempo real.

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://your-domain.com
    description: Production

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key para autenticación

  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION_ERROR, RATE_LIMITED, INTERNAL_ERROR, CONFLICT, BAD_REQUEST]
            message:
              type: string
            details:
              type: object
            timestamp:
              type: integer

    Poll:
      type: object
      properties:
        id:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              label:
                type: string
              votes:
                type: integer
              color:
                type: string
        totalVotes:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: integer
        startedAt:
          type: integer
        endedAt:
          type: integer

    Prediction:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        outcomes:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              points:
                type: integer
              users:
                type: integer
        status:
          type: string
          enum: [active, locked, resolved, cancelled]
        winningOutcomeId:
          type: string
        createdAt:
          type: integer

    Giveaway:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        keyword:
          type: string
        mode:
          type: string
          enum: [viewers, keyword, subs]
        participantCount:
          type: integer
        isActive:
          type: boolean
        winner:
          type: string
        createdAt:
          type: integer

    Timer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        duration:
          type: integer
        remaining:
          type: integer
        isRunning:
          type: boolean
        isPaused:
          type: boolean
        createdAt:
          type: integer

    OBSStatus:
      type: object
      properties:
        connected:
          type: boolean
        version:
          type: string
        platform:
          type: string
        currentScene:
          type: string

    Metrics:
      type: object
      properties:
        viewers:
          type: integer
        peakViewers:
          type: integer
        chatMessages:
          type: integer
        chatMessagesPerMinute:
          type: number
        engagement:
          type: number
        uptime:
          type: integer
        timestamp:
          type: integer

paths:
  /api/v1/polls:
    get:
      summary: Listar encuestas
      tags: [Polls]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de encuestas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Poll'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      perPage:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
    post:
      summary: Crear encuesta
      tags: [Polls]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, options]
              properties:
                question:
                  type: string
                options:
                  type: array
                  items:
                    type: string
                  minItems: 2
                  maxItems: 10
      responses:
        '200':
          description: Encuesta creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Poll'

  /api/v1/polls/{id}:
    get:
      summary: Obtener encuesta
      tags: [Polls]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Encuesta encontrada
        '404':
          description: Encuesta no encontrada

  /api/v1/polls/{id}/start:
    post:
      summary: Iniciar encuesta
      tags: [Polls]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Encuesta iniciada
        '409':
          description: Encuesta ya activa

  /api/v1/polls/{id}/stop:
    post:
      summary: Detener encuesta
      tags: [Polls]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Encuesta detenida

  /api/v1/predictions:
    get:
      summary: Listar predicciones
      tags: [Predictions]
      responses:
        '200':
          description: Lista de predicciones
    post:
      summary: Crear predicción
      tags: [Predictions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, outcomes]
              properties:
                title:
                  type: string
                outcomes:
                  type: array
                  items:
                    type: object
                    properties:
                      title:
                        type: string
      responses:
        '200':
          description: Predicción creada

  /api/v1/giveaways:
    get:
      summary: Listar sorteos
      tags: [Giveaways]
      responses:
        '200':
          description: Lista de sorteos
    post:
      summary: Crear sorteo
      tags: [Giveaways]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mode]
              properties:
                name:
                  type: string
                keyword:
                  type: string
                mode:
                  type: string
                  enum: [viewers, keyword, subs]
      responses:
        '200':
          description: Sorteo creado

  /api/v1/giveaways/{id}/draw:
    post:
      summary: Seleccionar ganador
      tags: [Giveaways]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ganador seleccionado

  /api/v1/timers:
    get:
      summary: Listar timers
      tags: [Timers]
      responses:
        '200':
          description: Lista de timers
    post:
      summary: Crear timer
      tags: [Timers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, duration]
              properties:
                name:
                  type: string
                duration:
                  type: integer
                  description: Duración en segundos
                autoStart:
                  type: boolean
      responses:
        '200':
          description: Timer creado

  /api/v1/obs/status:
    get:
      summary: Estado de conexión OBS
      tags: [OBS]
      responses:
        '200':
          description: Estado de OBS
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/OBSStatus'

  /api/v1/obs/scenes:
    get:
      summary: Listar escenas
      tags: [OBS]
      responses:
        '200':
          description: Lista de escenas

  /api/v1/obs/scenes/switch:
    post:
      summary: Cambiar escena
      tags: [OBS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sceneName]
              properties:
                sceneName:
                  type: string
      responses:
        '200':
          description: Escena cambiada

  /api/v1/metrics/current:
    get:
      summary: Métricas actuales
      tags: [Metrics]
      responses:
        '200':
          description: Métricas en tiempo real
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Metrics'

  /api/v1/metrics/history:
    get:
      summary: Histórico de sesiones
      tags: [Metrics]
      responses:
        '200':
          description: Lista de sesiones

tags:
  - name: Polls
    description: Gestión de encuestas
  - name: Predictions
    description: Gestión de predicciones
  - name: Giveaways
    description: Gestión de sorteos
  - name: Timers
    description: Gestión de timers
  - name: OBS
    description: Control de OBS
  - name: Metrics
    description: Métricas del stream
